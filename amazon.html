<!DOCTYPE html>
<html>
  <head>
    <title>PassiJuice Project</title>

    <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Load a font called Roboto from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Here are the CSS files for this page. -->
    <link rel="stylesheet" href="styles/shared/general.css">
    <link rel="stylesheet" href="styles/shared/amazon-header.css">
    <link rel="stylesheet" href="styles/pages/amazon.css">
  </head>
  <body>
    <div class="amazon-header">
      <div class="amazon-header-left-section">
        <a href="amazon.html" class="header-link">
          <img class="amazon-logo"
            src="images/logo.jpg">
          <img class="amazon-mobile-logo"
            src="images/logo.jpg">
        </a>
      </div>

      <div class="amazon-header-middle-section">
        <input class="search-bar" type="text" placeholder="Search">

        <button class="search-button">
          <img class="search-icon" src="images/icons/search-icon.png">
        </button>
      </div>

      <div class="amazon-header-right-section">
        <a class="orders-link header-link" href="index.html">
          <span class="returns-text">HOME</span>
          <span class="orders-text">PAGE</span>
        </a>

        <a class="cart-link header-link" href="checkout.html">
          <img class="cart-icon" src="images/icons/cart-icon.png">
          <div class="cart-quantity js-cart-quantity">0</div>
          <div class="cart-text">Cart</div>
        </a>
      </div>
    </div>
    
    <div class="main">
      <div class="products-grid js-products-grid">
    </div>
    <div class="description">
      <div>
        <img src="images/logo.jpg" width="50%" >

      </div>
      <div class="contact">
        <h1>Contact info</h1>
        <p><img src="images/icons/telegram.png" height="30">
          <b>002939494949</b></p>
          <p><img src="images/icons/clock.png" height="30">
            <b>Mon-sun 7:00-10:00</b>
          </p>
          <p>
            <img src="images/icons/phone-call.png" height="30">
            <b>+256 0768584956/+255 07546373828</b>
          </p>
          <h2>Email:</h2>
          <b><u>passijuice@gmail.com</u></b>
      </div>
      <div>
        <h1>Feedback/Queries</h1>
        <form>
          <label>Email:</label>
          <input type="email">
          <br>
          <br>
          <label>Contact:</label>
          <input type="tel">
          <br>
          <br>
          <label>Description:</label>
          <br>
          <textarea cols="50" rows="10">
          WHAT'S YOUR ISSUE?
          </textarea>
          <input type="submit">
        </form>
        <audio autoplay loop>
      <source src="audio/y2mate.com - Tuza Official Lyric Video.mp3">
        </audio>
      </div>
    </div>
    <script src="data/cart.js"></script>
    <script  src="data/products.js"></script>
    <script  src="scripts/amazon.js"></script>
  </body>
</html>
